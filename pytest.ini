[pytest]
# Karmi test-suite configuration.
# Created at the repo root because neither pytest.ini nor a pyproject.toml /
# setup.cfg pytest section existed at the time (checked 2026-10).
# dataset/tests is collected too — it was passing but never run by `pytest -q`.
testpaths = tests dataset/tests
pythonpath = .
addopts = -ra -p no:cacheprovider
markers =
    slow: renders PDFs or runs full uploads (deselect with -m "not slow")
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`